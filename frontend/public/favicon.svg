<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark background glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#05050A" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Platinum Gradient 1 -->
    <linearGradient id="metalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Metallic Platinum Gradient 2 (Reverse) -->
    <linearGradient id="metalGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="40%" stop-color="#CBD5E1" />
      <stop offset="80%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Cyan Energy Joint Glow -->
    <linearGradient id="cyanJoint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>

    <!-- Bevel Highlight -->
    <linearGradient id="bevelHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect for favicon clarity -->
  <rect width="512" height="512" rx="100" fill="#07080E" />
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />

  <!-- Outer Emblem Border Ring -->
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="rgba(0, 217, 255, 0.2)" stroke-width="4" />

  <!-- Main Interlocking 'X' Emblem Group -->
  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)">

    <!-- Top Left to Bottom Right Band (Underpass/Overpass Loop) -->
    <path d="M 120 120 
             L 210 120 
             L 392 302 
             L 392 392 
             L 302 392 
             L 120 210 Z" 
          fill="url(#metalGrad1)" 
          stroke="#1E293B" 
          stroke-width="3" />

    <!-- Top Right to Bottom Left Band -->
    <path d="M 392 120 
             L 392 210 
             L 210 392 
             L 120 392 
             L 120 302 
             L 302 120 Z" 
          fill="url(#metalGrad2)" 
          stroke="#1E293B" 
          stroke-width="3" />

    <!-- Inner Cutout Octagon/Knot Details for 3D Interlocking Effect -->
    <path d="M 210 120 L 302 120 L 256 166 Z" fill="#475569" />
    <path d="M 392 210 L 392 302 L 346 256 Z" fill="#334155" />
    <path d="M 302 392 L 210 392 L 256 346 Z" fill="#475569" />
    <path d="M 120 302 L 120 210 L 166 256 Z" fill="#334155" />

    <!-- Cyan Glowing Joint Accents (Connecting Nodes) -->
    <rect x="236" y="186" width="40" height="12" rx="4" transform="rotate(45 256 192)" fill="url(#cyanJoint)" />
    <rect x="236" y="314" width="40" height="12" rx="4" transform="rotate(45 256 320)" fill="url(#cyanJoint)" />
    <rect x="186" y="236" width="12" height="40" rx="4" transform="rotate(45 192 256)" fill="url(#cyanJoint)" />
    <rect x="314" y="236" width="12" height="40" rx="4" transform="rotate(45 320 256)" fill="url(#cyanJoint)" />

    <!-- Center Interlocking Core Ring -->
    <polygon points="256,206 306,256 256,306 206,256" fill="none" stroke="url(#cyanJoint)" stroke-width="8" stroke-linejoin="round" />
  </g>
</svg>